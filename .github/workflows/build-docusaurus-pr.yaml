name: Build Docusaurus PR

on:
  pull_request:
jobs:
  docusaurus-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: |
            **/*.md
            **/*.mdx

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - run: yarn set version berry
      - run: yarn install --immutable
      - run: yarn run build
